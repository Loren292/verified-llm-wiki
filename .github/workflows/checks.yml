name: checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (each check against planted errors)
        run: python -m unittest discover -s tests -v
      - name: Lint the template
        run: python tools/wikicheck.py lint --root template
      - name: Lint the example
        run: python tools/wikicheck.py lint --root example
      - name: Verify the example review's citations
        run: >
          python tools/wikicheck.py cite "example/reviews/reviewer - metrics - 28-10.md"
          --root example --files wiki/metrics.md --terms shipping
